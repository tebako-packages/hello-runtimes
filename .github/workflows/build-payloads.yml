name: build-payloads

# The hello-runtimes suite pipeline: per (app × platform) legs build the
# payload and smoke it against EVERY runtime line the recipe names for
# the app (the payload bytes are runtime-independent — pure-language
# law), then a tag-dispatched publish signs and ships the set.
#
# The installer legs (installer-msi / installer-pkg) build the OS-native
# containers for hello-ruby in both compositions (lean: toolset +
# install-time seed with the runtime prefetched at install; fat: the
# self-contained press — zero network at install or run), rehearsing the
# install on EVERY trigger and shipping signed containers exactly on the
# owner-dispatched publish run (containers ship signed-only — a disarmed
# signing plane builds + rehearses unsigned and ships nothing).
#
# Leg grammar: every leg is runner-native (the suite compiles nothing).
# GH_TOKEN needs contents:read on the runtime factories (public).
#
# Release: NEVER automatic — owner dispatch with publish: true on a tag.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this run''s payloads to the tag release + registry PR (owner-only act; requires running on a tag ref)'
        type: boolean
        default: false

# One run per branch/PR-head at a time; a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0
      - id: pins
        run: echo "matrix=$(ruby tools/pins.rb --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}   # pins.rb emits {"include": [...]}
    name: ${{ matrix.app }} (${{ matrix.triplet }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash        # Git Bash on the windows legs; inert on POSIX
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0

      - name: Leg env (Tebakofile is the SSOT)
        run: ruby tools/pins.rb --env "${{ matrix.app }}" "${{ matrix.triplet }}" >> "$GITHUB_ENV"

      - name: Set up the hosted JDK 21 (java legs only)
        # The java app's payload is a jar compiled from its own source
        # (audience law 3) — the JRE-class runtime cannot compile. The
        # other engines' legs compile nothing and skip this entirely.
        if: matrix.engine == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the pinned tebako tools (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          # -fsSL + retries: a transient flake fails loudly, never a
          # silent error page the sha pin then rejects.
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TEBAKO_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TFS_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHA256PINS; else shasum -a 256 -c SHA256PINS; fi
          # The pinned digests must also agree with the release's own
          # SHA256SUMS (a release-side swap is a mismatch, named).
          for asset in "$TEBAKO_ASSET" "$TFS_ASSET"; do
            want="$(grep "  $asset\$" SHA256PINS | cut -d' ' -f1)"
            got="$(grep "  $asset\$" SHA256SUMS | cut -d' ' -f1 || true)"
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: Tebakofile=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod +x "$TEBAKO_ASSET" "$TFS_ASSET"
          # Normalize to .tools/tebako + .tools/tfs (the .exe suffix kept
          # on windows so the shim resolution is literal).
          sfx=""; case "$TEBAKO_ASSET" in *.exe) sfx=.exe ;; esac
          mv "$TEBAKO_ASSET" "tebako$sfx"
          mv "$TFS_ASSET" "tfs$sfx"

      - name: Build the payload
        run: TFS_CLI="$PWD/.tools/tfs" tools/build

      - name: Stage the runtime line(s) and boot-smoke each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r rt_v rt_tb rt_rel ow_f ow_v ow_tb ow_rel; do
            echo "== $APP on $rt_v (tebako $rt_tb, $rt_rel)"
            MIRROR="$PWD/out/mirror-$rt_v"
            RT_V="$rt_v" RT_TEBAKO="$rt_tb" RELEASE_TAG="$rt_rel" \
              HOST_IDS="$HOST_ID" MIRROR="$MIRROR" tools/stage_runtime
            # The shard owns the exe/image asset spellings (factories
            # differ on the windows .exe suffix) — the staged pair's
            # literal names FLOW from the per-stem file; compose nothing.
            stem="tebako-runtime-$rt_tb-$rt_v-$HOST_ID"
            . "$MIRROR/v$rt_tb/$stem.stage.env"
            exe="$RUNTIME_EXE"
            img="$RUNTIME_IMAGE"
            # The runtime-on-runtime composition (jruby/truffleruby): the
            # recipe's runtime line names its OWNER — stage the owner
            # line into the same mirror (its own tebako line's subdir,
            # never colliding) and flow its staged pair + the depending
            # shard's declared mount to the smoke.
            owner_env=()
            if [ -n "${ow_f:-}" ]; then
              echo "== owner: $ow_f $ow_v (tebako $ow_tb, $ow_rel)"
              RT_V="$ow_v" RT_TEBAKO="$ow_tb" RELEASE_TAG="$ow_rel" \
                FACTORY_REPO="$ow_f" HOST_IDS="$HOST_ID" MIRROR="$MIRROR" tools/stage_runtime
              ow_stem="tebako-runtime-$ow_tb-$ow_v-$HOST_ID"
              . "$MIRROR/v$ow_tb/$ow_stem.stage.env"
              ow_mount="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("on_runtime").fetch("mount")' "$MIRROR/v$rt_tb/$stem.manifest.json")"
              owner_env=(OWNER_EXE="$RUNTIME_EXE" OWNER_IMAGE="$RUNTIME_IMAGE" OWNER_MOUNT="$ow_mount")
            fi
            # Native windows tools cannot read Git Bash's POSIX path
            # spellings — go windows-form where cygpath exists (inert
            # on POSIX).
            if command -v cygpath >/dev/null 2>&1; then
              exe="$(cygpath -m "$exe")"
              img="$(cygpath -m "$img")"
              if [ ${#owner_env[@]} -gt 0 ]; then
                owner_env=(OWNER_EXE="$(cygpath -m "${owner_env[0]#OWNER_EXE=}")" OWNER_IMAGE="$(cygpath -m "${owner_env[1]#OWNER_IMAGE=}")" "OWNER_MOUNT=$ow_mount")
              fi
            fi
            env RUNTIME="$exe" RUNTIME_IMAGE="$img" ${owner_env[@]+"${owner_env[@]}"} \
              TFS="$PWD/.tools/tfs" TEBAKO="$PWD/.tools/tebako" \
              tools/boot_smoke "out/$TRIPLET/$APP-$PKG_VERSION-$HOST_ID.tfs"
          done < <(ruby tools/pins.rb --runtimes "$APP")

      - name: Stage the artifacts
        run: |
          set -euo pipefail
          mkdir -p "dist/$TRIPLET"
          cp "out/$TRIPLET/$APP-$PKG_VERSION-$HOST_ID.tfs" "dist/$TRIPLET/"
          cp "out/$TRIPLET/$APP-$PKG_VERSION.manifest.yaml" "dist/$TRIPLET/"

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.app }}-${{ matrix.triplet }}
          path: dist/
          retention-days: 1

  slice-acceptance:
    # The extension-slice dispatch proof (spec 03 §2.8, spec 07 §2 step
    # 3): hello-ruby declares the `flavors` extension point and
    # hello-flavor-acme augments it. Both install into one scratch store;
    # dispatching the base must then attach the slice (auto-discovery —
    # the flavor's tag line joins the greeting and the attach journals),
    # a killed store scan (auto_slices: false) must drop it, and an env
    # pin must re-attach it even so. Requires tools carrying the slice
    # model — the press must round-trip `augments` into the embedded
    # manifest AND the shim must carry the store scan; the recipe pin
    # gates that, so this job only goes green on a slice-capable release.
    # The pinned RUNTIME's engine must also carry the mount-boundary
    # synthesis (spec 17 §1 — the drop-in enumerates the point dir and
    # Gem.paths= realpaths the mounted homes), so the leg goes green only
    # on a runtime built from a slice-capable tools release.
    needs: [plan, build]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEBAKO_HOME: ${{ github.workspace }}/.store
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0

      - name: Leg env (Tebakofile is the SSOT)
        run: ruby tools/pins.rb --env hello-ruby aarch64-macos >> "$GITHUB_ENV"

      - name: Fetch the pinned tebako tools (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TEBAKO_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$SHIM_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" | shasum -a 256 -c -
          echo "$SHIM_SHA256  $SHIM_ASSET" | shasum -a 256 -c -
          chmod +x "$TEBAKO_ASSET" "$SHIM_ASSET"
          # The dispatcher is linked sibling-wise: tebako-shim must sit
          # beside the CLI.
          mv "$TEBAKO_ASSET" tebako
          mv "$SHIM_ASSET" tebako-shim

      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*-aarch64-macos
          path: out/

      - name: Restore the out/<triplet>/ layout
        # Same merge as the publish job: each artifact carries its leg's
        # dist/<triplet>/ contents nested one level deep.
        run: |
          set -euo pipefail
          for d in out/payload-*/; do
            for t in "$d"*/; do
              triplet="$(basename "$t")"
              mkdir -p "out/$triplet"
              mv "$t"* "out/$triplet/"
            done
            rm -rf "$d"
          done
          ls -la out/aarch64-macos/

      - name: Stage the runtime mirror (hello-ruby's first line)
        # The dispatch-time runtime fetch resolves against the file://
        # mirror (TEBAKO_RUNTIME_MIRROR on the dispatch steps) — zero
        # live network at the assert steps; the config pin names the line.
        run: |
          set -euo pipefail
          read -r rt_v rt_tb rt_rel < <(ruby tools/pins.rb --runtimes hello-ruby | head -1)
          RT_V="$rt_v" RT_TEBAKO="$rt_tb" RELEASE_TAG="$rt_rel" \
            FACTORY_REPO="$(ruby -ryaml -e "puts YAML.load_file('Tebakofile').dig('apps', 'hello-ruby', 'factory')")" \
            HOST_IDS=macos-arm64 MIRROR="$PWD/out/runtime-mirror" tools/stage_runtime
          mkdir -p "$TEBAKO_HOME"
          printf 'runtimes:\n  ruby: {version: "%s", tebako: "%s"}\n' "$rt_v" "$rt_tb" >> "$TEBAKO_HOME/config.yaml"

      - name: Install base + slice into the scratch store
        # Bare .tfs images install only through a registry (spec 07 §3 —
        # a path install is for stitched packages). This leg proves the
        # STORE behavior, not the release plumbing (the publish job's own
        # verify covers that): publish both payloads to a file:// mirror
        # (zero network — publish's built-in verify rides the mirror),
        # then re-point the generated registry at the mirror in the
        # universal form (per-triplet rows require a service ref, spec 04
        # §2) and install by name — registry installs register the shims.
        run: |
          set -euo pipefail
          TEBAKO_CLI="$PWD/.tools/tebako"
          mirror="$PWD/out/publish-mirror"
          reg="$PWD/out/acceptance-registry.yaml"
          tag="slice-acceptance"
          # The registry lands under out/ (untracked): this leg never
          # touches the repo's real tpkg-registry.yaml (the publish job
          # owns that file at release time).
          for app in hello-ruby hello-flavor-acme; do
            "$TEBAKO_CLI" publish --name "$app" \
              --release "tfs:github:tebako-packages/hello-runtimes:$tag" \
              --payload "aarch64-macos=$PWD/out/aarch64-macos/$app-$PKG_VERSION-$HOST_ID.tfs" \
              --registry-out "$reg" \
              --upload-mirror "$mirror"
          done
          ruby -ryaml -e '
            mirror, tag, reg = ARGV.fetch(0), ARGV.fetch(1), ARGV.fetch(2)
            doc = YAML.load_file(reg)
            doc["payloads"].each do |p|
              p["versions"].each do |v|
                _trip, row = v["platforms"].first
                v["platforms"] = "universal"
                v["release"]["ref"] = "file://#{mirror}/#{tag}/#{row["artifact"]}?sha256=#{row["sha256"]}"
              end
            end
            File.write(reg.sub(/\.yaml$/, "-file.yaml"), doc.to_yaml)
          ' "$mirror" "$tag" "$reg"
          "$TEBAKO_CLI" add-registry "file://${reg%.yaml}-file.yaml"
          "$TEBAKO_CLI" install "hello-ruby@$PKG_VERSION"
          "$TEBAKO_CLI" install "hello-flavor-acme@$PKG_VERSION"
          # The version chain's explicit pin (no registry default read at
          # dispatch in this leg — the chain links env/project/config all
          # resolve before the registry link).
          "$TEBAKO_CLI" shim use hello-ruby "$PKG_VERSION"

      - name: The slice attaches (auto-discovery)
        env:
          TEBAKO_RUNTIME_MIRROR: file://${{ github.workspace }}/out/runtime-mirror
        run: |
          set -euo pipefail
          out="$("$TEBAKO_HOME/shims/hello-ruby")"
          echo "$out"
          grep -q "Hello from tebako" <<<"$out"
          grep -q "acme flavor 0.1.0" <<<"$out" \
            || { echo "::error::the installed slice did not attach — the tag line is missing"; exit 1; }
          grep -q "event=slice-augment" "$TEBAKO_HOME/journal.log" \
            || { echo "::error::no slice-augment journal event for the attach"; exit 1; }

      - name: "auto_slices: false kills the scan; the env pin re-attaches"
        env:
          TEBAKO_RUNTIME_MIRROR: file://${{ github.workspace }}/out/runtime-mirror
        run: |
          set -euo pipefail
          echo "auto_slices: false" >> "$TEBAKO_HOME/config.yaml"
          out="$("$TEBAKO_HOME/shims/hello-ruby")"
          echo "$out"
          if grep -q "acme flavor" <<<"$out"; then
            echo "::error::auto_slices: false but the slice still attached"; exit 1
          fi
          out2="$(TEBAKO_HELLO_RUBY_SLICES="hello-flavor-acme@$PKG_VERSION" "$TEBAKO_HOME/shims/hello-ruby")"
          echo "$out2"
          grep -q "acme flavor 0.1.0" <<<"$out2" \
            || { echo "::error::the env pin did not attach the slice"; exit 1; }

  installer-msi:
    # The Windows MSI container for hello-ruby, one leg per composition
    # (Tebakofile installers:). The environment is the Azure OIDC
    # boundary — the federated credential matches on it.
    #
    # The fat leg is GATED OFF (not silent — this comment is the
    # pointer): a self-contained Windows press against any current
    # runtime line fails its boot closed on a duplicate library-alias
    # declaration (the press seeds the app tree from the runtime image,
    # manifest included, so the env image and the payload image declare
    # the same aliases — upstream: tamatebako/tebako#486, open). The
    # documented pin-a-runtime workaround predates the carried-runtime
    # wire form (the pre-alias lines' drivers cannot parse the
    # <package>:<slot> env image the v2 bootstrap hands off — verified
    # in this repo's CI), so no client-side pin exists. The macOS fat
    # pkg legs rehearse the fat composition; this matrix re-widens the
    # day #486 ships in a tebako release.
    name: installer msi (${{ matrix.composition }})
    needs: [plan, build]
    runs-on: windows-2022
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        composition: [lean]
    defaults:
      run:
        shell: bash        # Git Bash; the rehearsal steps use pwsh directly
    env:
      # The signing plane arms EXACTLY on the owner-dispatched publish run
      # on a tag — every other trigger rehearses unsigned and ships
      # nothing (a same-repo PR would otherwise Azure-sign rehearsal
      # bytes with the production profile).
      ARM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0

      - name: Leg env (Tebakofile is the SSOT)
        run: |
          ruby tools/pins.rb --env hello-ruby x86_64-windows-ucrt >> "$GITHUB_ENV"
          ruby tools/pins.rb --installer-env "${{ matrix.composition }}" >> "$GITHUB_ENV"

      - name: Fetch the pinned tebako tools (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          # -fsSL + retries: a transient flake fails loudly, never a
          # silent error page the sha pin then rejects.
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TEBAKO_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TFS_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$SHIM_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TPKG_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          {
            echo "$TEBAKO_SHA256  $TEBAKO_ASSET"
            echo "$TFS_SHA256  $TFS_ASSET"
            echo "$SHIM_SHA256  $SHIM_ASSET"
            echo "$TPKG_SHA256  $TPKG_ASSET"
          } > SHA256PINS
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHA256PINS; else shasum -a 256 -c SHA256PINS; fi
          # The pinned digests must also agree with the release's own
          # SHA256SUMS (a release-side swap is a mismatch, named).
          for asset in "$TEBAKO_ASSET" "$TFS_ASSET" "$SHIM_ASSET" "$TPKG_ASSET"; do
            want="$(grep "  $asset\$" SHA256PINS | cut -d' ' -f1)"
            got="$(grep "  $asset\$" SHA256SUMS | cut -d' ' -f1 || true)"
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: Tebakofile=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod +x "$TEBAKO_ASSET" "$TFS_ASSET" "$SHIM_ASSET" "$TPKG_ASSET"
          mv "$TEBAKO_ASSET" tebako.exe
          mv "$TFS_ASSET" tfs.exe
          mv "$SHIM_ASSET" tebako-shim.exe
          mv "$TPKG_ASSET" tebako-pkg.exe

      - name: Fetch the pinned installer source set (sha256-verified)
        run: tools/fetch_installer_sources

      - name: Set up WiX v5
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          wix --version

      - name: Arm check — Windows signing
        id: signgate
        env:
          WINDOWS_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.WINDOWS_SIGNING_ENABLED || 'false' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
        run: bash .install-src/ci/windows-sign-gate.sh

      - name: Press the self-contained exe (fat composition)
        if: matrix.composition == 'fat'
        env:
          TEBAKO_SIGNING_KEY: ${{ secrets.TEBAKO_CI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # The runtime pair resolves through the CLI's own verified
          # fetch (release-index sha256 + signature checks in-process) —
          # the standard press path; the recipe pins the exact line.
          export TEBAKO_HOME; TEBAKO_HOME="$(cygpath -m "$PWD/out/press-home")"
          mkdir -p out/fat
          sign=()
          if [ -n "${TEBAKO_SIGNING_KEY:-}" ]; then
            # The tebako-plane trailer signature (the registry-pinned CI
            # subkey) — the third signature surface of the container.
            mkdir -p "out/press-home/keys"
            printf '%s\n' "$TEBAKO_SIGNING_KEY" > "out/press-home/keys/ci-signing.key"
            chmod 600 "out/press-home/keys/ci-signing.key"
            sign=(--sign="$SIGNING_KEYID")
          else
            echo "::notice::no signing key in this context — the rehearsal press carries an unsigned trailer"
          fi
          ./.tools/tebako.exe press -r "$(cygpath -m "$PWD/apps/hello-ruby")" -e hello.rb \
            -m self-contained -R "$RT_V" --tebako-version "$RT_TEBAKO" --format limnifs \
            -o "$(cygpath -m "$PWD/out/fat/hello-ruby")" -p "$(cygpath -m "$PWD/out/press-prefix")" \
            ${sign[@]+"${sign[@]}"}
          fat_exe="$(find out/fat -maxdepth 1 -type f -name 'hello-ruby*' | head -1)"
          [ -n "$fat_exe" ] || { echo "::error::press produced no exe under out/fat"; exit 1; }
          echo "FAT_EXE=$(cygpath -m "$PWD/$fat_exe")" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        if: steps.signgate.outputs.armed == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2 (sha-pinned 2026-09-11)
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the fat exe (post-press, pre-wrap — the binary inside is its own signature surface)
        if: steps.signgate.outputs.armed == 'true' && matrix.composition == 'fat'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1 (sha-pinned 2026-09-11)
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: out/fat
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: hello-ruby (tebako self-contained package)

      - name: Verify the fat exe's signature
        if: steps.signgate.outputs.armed == 'true' && matrix.composition == 'fat'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature "$env:FAT_EXE"
          if ($sig.Status -ne 'Valid') { Write-Host "::error::fat exe Authenticode status '$($sig.Status)'"; exit 1 }
          if ($null -eq $sig.TimeStamperCertificate) { Write-Host "::error::no TimeStamperCertificate on the fat exe"; exit 1 }
          Write-Host "fat exe signed+timestamped: $($sig.SignerCertificate.Subject)"

      - name: Build the MSI (unsigned — the Azure step signs in place)
        run: tools/install_msi

      - name: Sign the MSI (Azure Artifact Signing signs MSI natively)
        if: steps.signgate.outputs.armed == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1 (sha-pinned 2026-09-11)
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: out/installers
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ${{ env.PRODUCT_NAME }} installer (tebako-packages)

      - name: Verify the MSI signature
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem -Path 'out\installers' -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { Write-Host "::error::expected exactly 1 MSI under out\installers, found $($msi.Count)"; exit 1 }
          $signtool = @(
            Get-ChildItem -Path "$env:LOCALAPPDATA\TrustedSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$env:LOCALAPPDATA\ArtifactSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          ) | Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Host "::error::signtool.exe not found"; exit 1 }
          $out = & $signtool.FullName verify /pa /v $msi[0].FullName 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::signtool verify /pa FAILED for the MSI"; exit 1 }
          if ($out -notmatch 'signature is timestamped' -and $out -notmatch 'RFC ?3161') { Write-Host "::error::no RFC 3161 countersignature on the MSI"; exit 1 }
          $sig = Get-AuthenticodeSignature $msi[0].FullName
          if ($sig.Status -ne 'Valid') { Write-Host "::error::Get-AuthenticodeSignature status '$($sig.Status)'"; exit 1 }
          if ($null -eq $sig.TimeStamperCertificate) { Write-Host "::error::no TimeStamperCertificate on the MSI"; exit 1 }
          Write-Host "MSI signed+timestamped: $($sig.SignerCertificate.Subject)"

      # The install rehearsal gates ALWAYS (signed or not — it proves the
      # container actually installs and the installed command runs; a
      # broken template fails HERE, never on a user box).
      - name: Install rehearsal (msiexec round-trip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem -Path 'out\installers' -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { Write-Host "::error::expected exactly 1 MSI under out\installers"; exit 1 }
          $root = "C:\Program Files\$env:PRODUCT_NAME"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $msi[0].FullName, '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\msi-install.log"
          if ($p.ExitCode -ne 0) { Write-Host "::error::msiexec /i failed: $($p.ExitCode)"; exit 1 }
          if ($env:COMPOSITION -eq 'lean') {
            & "$root\bin\tebako.exe" --version
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::installed tebako.exe --version failed"; exit 1 }
            # The seed ran at install (deferred, SYSTEM — the runner is
            # networked): its effects are the rehearsal. The install-time
            # prefetch (the warm set) must have landed the runtime.
            foreach ($f in @('bootstrap-seed.cmd', 'home\config.yaml', "home\payloads\$env:INSTALL_APP")) {
              if (-not (Test-Path "$root\$f")) { Write-Host "::error::seed effect missing: $root\$f (see $env:RUNNER_TEMP\msi-install.log)"; exit 1 }
            }
            $rt = @(Get-ChildItem "$root\home\runtimes" -Directory -ErrorAction SilentlyContinue)
            if ($rt.Count -eq 0) { Write-Host "::error::the warm set is bound but $root\home\runtimes is empty — the install-time prefetch did not land"; exit 1 }
            $out = & "$root\home\shims\$env:INSTALL_APP.exe" 2>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'Hello from tebako \(ruby') { Write-Host "::error::the warmed shim's greeting is wrong: $out"; exit 1 }
            Write-Host 'lean rehearsal OK (registry registered, payload + runtime prefetched at install, the warmed shim greets)'
          } else {
            # The airgap proof: a scratch home + TEBAKO_OFFLINE=1 — the
            # exe self-stages its carried runtime and greets with zero
            # network and zero pre-existing cache.
            $env:TEBAKO_OFFLINE = '1'
            $env:TEBAKO_HOME = "$env:RUNNER_TEMP\fat-home"
            $out = & "$root\bin\$env:INSTALL_APP.exe" 2>&1 | Out-String
            Remove-Item Env:TEBAKO_OFFLINE, Env:TEBAKO_HOME
            Write-Host $out
            if ($out -notmatch "Hello from tebako \(ruby $env:RT_V") { Write-Host "::error::the fat exe's greeting is wrong: $out"; exit 1 }
            Write-Host 'fat rehearsal OK (installed exe greets with TEBAKO_OFFLINE=1 against a scratch home — zero network)'
          }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', $msi[0].FullName, '/qn', '/norestart'
          if ($p.ExitCode -ne 0) { Write-Host "::error::msiexec /x failed: $($p.ExitCode)"; exit 1 }
          if (Test-Path "$root\bin") { Write-Host "::error::uninstall left $root\bin"; exit 1 }
          # The seeded machine home survives uninstall BY DESIGN (store
          # content is machine data — a reinstall reuses it); the
          # rehearsal cleans it up itself.
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Write-Host 'install rehearsal OK (install → run → uninstall, the package-authored tree clean)'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.composition }}-windows-ucrt64
          path: out/installers/
          retention-days: 1

  installer-pkg:
    # The macOS pkg container for hello-ruby, one leg per (composition ×
    # arch). Signing is in-script (productsign + notarize + staple)
    # between the two signing gates — the fail-closed setup scripts are
    # part of the pinned installer source set.
    name: installer pkg (${{ matrix.composition }}, ${{ matrix.platform }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {composition: lean, platform: macos-arm64,  triplet: aarch64-macos, os: macos-latest}
          - {composition: lean, platform: macos-x86_64, triplet: x86_64-macos,  os: macos-15-intel}
          - {composition: fat,  platform: macos-arm64,  triplet: aarch64-macos, os: macos-latest}
          - {composition: fat,  platform: macos-x86_64, triplet: x86_64-macos,  os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0

      - name: Leg env (Tebakofile is the SSOT)
        run: |
          ruby tools/pins.rb --env hello-ruby "${{ matrix.triplet }}" >> "$GITHUB_ENV"
          ruby tools/pins.rb --installer-env "${{ matrix.composition }}" >> "$GITHUB_ENV"

      - name: Fetch the pinned tebako tools (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TEBAKO_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TFS_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$SHIM_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TPKG_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          {
            echo "$TEBAKO_SHA256  $TEBAKO_ASSET"
            echo "$TFS_SHA256  $TFS_ASSET"
            echo "$SHIM_SHA256  $SHIM_ASSET"
            echo "$TPKG_SHA256  $TPKG_ASSET"
          } > SHA256PINS
          shasum -a 256 -c SHA256PINS
          for asset in "$TEBAKO_ASSET" "$TFS_ASSET" "$SHIM_ASSET" "$TPKG_ASSET"; do
            want="$(grep "  $asset\$" SHA256PINS | cut -d' ' -f1)"
            got="$(grep "  $asset\$" SHA256SUMS | cut -d' ' -f1 || true)"
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: Tebakofile=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod +x "$TEBAKO_ASSET" "$TFS_ASSET" "$SHIM_ASSET" "$TPKG_ASSET"
          mv "$TEBAKO_ASSET" tebako
          mv "$TFS_ASSET" tfs
          mv "$SHIM_ASSET" tebako-shim
          mv "$TPKG_ASSET" tebako-pkg

      - name: Fetch the pinned installer source set (sha256-verified)
        run: tools/fetch_installer_sources

      - name: Set up Apple signing (Developer ID Application — the fat exe inside)
        if: matrix.composition == 'fat'
        env:
          APPLE_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.APPLE_SIGNING_ENABLED || 'false' }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .install-src/ci/macos-sign-setup.sh

      - name: Set up Apple installer signing (Developer ID Installer — the pkg container)
        id: signgate
        env:
          APPLE_INSTALLER_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.APPLE_INSTALLER_SIGNING_ENABLED || 'false' }}
          APPLE_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.APPLE_SIGNING_ENABLED || 'false' }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: bash .install-src/ci/macos-sign-setup-installer.sh

      - name: Press the self-contained exe (fat composition)
        if: matrix.composition == 'fat'
        env:
          TEBAKO_SIGNING_KEY: ${{ secrets.TEBAKO_CI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export TEBAKO_HOME="$PWD/out/press-home"
          mkdir -p out/fat
          sign=()
          if [ -n "${TEBAKO_SIGNING_KEY:-}" ]; then
            mkdir -p "$TEBAKO_HOME/keys"
            printf '%s\n' "$TEBAKO_SIGNING_KEY" > "$TEBAKO_HOME/keys/ci-signing.key"
            chmod 600 "$TEBAKO_HOME/keys/ci-signing.key"
            sign=(--sign="$SIGNING_KEYID")
          else
            echo "::notice::no signing key in this context — the rehearsal press carries an unsigned trailer"
          fi
          ./.tools/tebako press -r "$PWD/apps/hello-ruby" -e hello.rb \
            -m self-contained -R "$RT_V" --tebako-version "$RT_TEBAKO" --format limnifs \
            -o "$PWD/out/fat/hello-ruby" -p "$PWD/out/press-prefix" \
            ${sign[@]+"${sign[@]}"}
          fat_exe="$(find out/fat -maxdepth 1 -type f -name 'hello-ruby*' | head -1)"
          [ -n "$fat_exe" ] || { echo "::error::press produced no exe under out/fat"; exit 1; }
          echo "FAT_EXE=$PWD/$fat_exe" >> "$GITHUB_ENV"

      # Build → [armed: codesign the fat exe →] pkgbuild → productbuild →
      # [armed: productsign + notarize + staple] → install rehearsal
      # (always). All in-script (tools/install_pkg).
      - name: Build + sign + notarize + rehearse the pkg
        env:
          ENTITLEMENTS: ${{ github.workspace }}/.install-src/ci/runtime.entitlements
          APPLE_INSTALLER_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.APPLE_INSTALLER_SIGNING_ENABLED || 'false' }}
          APPLE_SIGNING_ENABLED: ${{ env.ARM == 'true' && vars.APPLE_SIGNING_ENABLED || 'false' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: tools/install_pkg

      # The rehearsal is the leg's verdict — when it fails, the pressed
      # exe itself is the evidence: upload it (always) so the trailer
      # forensics run against the real bytes instead of a guess.
      - name: Upload the fat exe forensics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fat-forensics-${{ matrix.composition }}-${{ matrix.platform }}
          path: |
            out/fat/
            out/installers/
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.composition }}-${{ matrix.platform }}
          path: out/installers/
          retention-days: 1

  publish:
    if: ${{ always() && !cancelled() && inputs.publish && needs.build.result == 'success' && needs.installer-msi.result == 'success' && needs.installer-pkg.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    needs: [plan, build, installer-msi, installer-pkg]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0

      - name: Pins
        run: |
          ruby tools/pins.rb --env hello-ruby aarch64-macos >> "$GITHUB_ENV"

      - name: Fetch the pinned tebako tools (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TEBAKO_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$SHIM_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$TPKG_ASSET"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" | shasum -a 256 -c -
          echo "$SHIM_SHA256  $SHIM_ASSET" | shasum -a 256 -c -
          echo "$TPKG_SHA256  $TPKG_ASSET" | shasum -a 256 -c -
          chmod +x "$TEBAKO_ASSET" "$SHIM_ASSET" "$TPKG_ASSET"
          # The publish verify installs the payload — the dispatcher must
          # sit BESIDE the CLI (shims resolve it sibling-wise).
          mv "$TEBAKO_ASSET" tebako
          mv "$SHIM_ASSET" tebako-shim
          # tebako-pkg signs the installer containers (detached .asc).
          mv "$TPKG_ASSET" tebako-pkg

      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          path: out/

      - name: Restore the out/<triplet>/ layout
        # Each payload-<app>-<triplet> artifact carries its leg's
        # dist/<triplet>/ contents nested one level deep; merge them back
        # to out/<triplet>/ (same-triplet dirs across apps never collide —
        # the filenames carry the app).
        run: |
          set -euo pipefail
          for d in out/payload-*/; do
            for t in "$d"*/; do
              triplet="$(basename "$t")"
              mkdir -p "out/$triplet"
              mv "$t"* "out/$triplet/"
            done
            rm -rf "$d"
          done

      - name: Stage the publish-verify mirror (each engine's first line)
        run: |
          set -euo pipefail
          for app in hello-ruby hello-python hello-java; do
            read -r rt_v rt_tb rt_rel < <(ruby tools/pins.rb --runtimes "$app" | head -1)
            RT_V="$rt_v" RT_TEBAKO="$rt_tb" RELEASE_TAG="$rt_rel" \
              FACTORY_REPO="$(ruby -ryaml -e "puts YAML.load_file('Tebakofile').dig('apps', '$app', 'factory')")" \
              HOST_IDS=macos-arm64 MIRROR="$PWD/out/runtime-mirror" tools/stage_runtime
          done
          # The composition apps (jruby/truffleruby): stage the depending
          # line AND its openjdk owner line into the same mirror — each
          # tebako line lands in its own v<line>/ subdir, and two
          # factories sharing a line accumulate in its derived index.
          for app in hello-jruby hello-truffleruby; do
            read -r rt_v rt_tb rt_rel ow_f ow_v ow_tb ow_rel < <(ruby tools/pins.rb --runtimes "$app" | head -1)
            RT_V="$rt_v" RT_TEBAKO="$rt_tb" RELEASE_TAG="$rt_rel" \
              FACTORY_REPO="$(ruby -ryaml -e "puts YAML.load_file('Tebakofile').dig('apps', '$app', 'factory')")" \
              HOST_IDS=macos-arm64 MIRROR="$PWD/out/runtime-mirror" tools/stage_runtime
            RT_V="$ow_v" RT_TEBAKO="$ow_tb" RELEASE_TAG="$ow_rel" \
              FACTORY_REPO="$ow_f" HOST_IDS=macos-arm64 MIRROR="$PWD/out/runtime-mirror" tools/stage_runtime
          done
          mkdir -p "$HOME/.tebako"
          {
            echo "runtimes:"
            for app in hello-ruby hello-python hello-java; do
              engine="$(ruby -ryaml -e "puts YAML.load_file('Tebakofile').dig('apps', '$app', 'engine')")"
              read -r rt_v rt_tb rt_rel < <(ruby tools/pins.rb --runtimes "$app" | head -1)
              printf '  %s: {version: "%s", tebako: "%s"}\n' "$engine" "$rt_v" "$rt_tb"
            done
          } >> "$HOME/.tebako/config.yaml"
          # The composition apps verify under ISOLATED stores: their
          # pins (ruby → the implementation line, java → the owner line)
          # would collide with the engine-keyed pins above (one engine,
          # two lines — the map keys by engine). Each store pins exactly
          # the app's two lines; the global mirror still serves bytes.
          for app in hello-jruby hello-truffleruby; do
            store="$PWD/.store-$app"
            mkdir -p "$store/keys"
            read -r rt_v rt_tb _ ow_f ow_v ow_tb _ < <(ruby tools/pins.rb --runtimes "$app" | head -1)
            {
              echo "runtimes:"
              printf '  ruby: {version: "%s", tebako: "%s"}\n' "$rt_v" "$rt_tb"
              printf '  java: {version: "%s", tebako: "%s"}\n' "$ow_v" "$ow_tb"
            } > "$store/config.yaml"
          done

      - name: Publish payloads + registry
        env:
          TEBAKO_RUNTIME_MIRROR: file://${{ github.workspace }}/out/runtime-mirror
          TEBAKO_SIGNING_KEY: ${{ secrets.TEBAKO_CI_SIGNING_KEY }}
          # The upload rides the live GitHub API — the CLI wants its own
          # token spelling (job-level GH_TOKEN serves gh only).
          TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TEBAKO_CLI="$PWD/.tools/tebako"
          : "${TEBAKO_SIGNING_KEY:?publish: recipe declares signing but TEBAKO_SIGNING_KEY is empty — a signing feedstock never publishes unsigned}"
          # tebako-cli resolves secret keys by keyid from
          # $TEBAKO_HOME/keys/*.key — stage the CI subkey there.
          TEBAKO_HOME="${TEBAKO_HOME:-$HOME/.tebako}"
          mkdir -p "$TEBAKO_HOME/keys"
          printf '%s\n' "$TEBAKO_SIGNING_KEY" > "$TEBAKO_HOME/keys/ci-signing.key"
          chmod 600 "$TEBAKO_HOME/keys/ci-signing.key"
          mirror="$(mktemp -d)"
          for app in hello-ruby hello-python hello-java hello-flavor-acme hello-jruby hello-truffleruby; do
            # The composition apps verify under their isolated stores
            # (the pins staged above); the CI signing key rides along.
            PUB_HOME="$TEBAKO_HOME"
            case "$app" in
              hello-jruby|hello-truffleruby)
                PUB_HOME="$PWD/.store-$app"
                cp "$TEBAKO_HOME/keys/ci-signing.key" "$PUB_HOME/keys/"
                ;;
            esac
            # shellcheck disable=SC2046  # --payload-args MUST word-split into the per-triplet --payload pairs
            args="$(ruby tools/pins.rb --payload-args "$app")"
            # 1. PROVE, zero network: the full clean-cache install
            #    (registry resolution, sha pins, signature check, shim
            #    dispatch) against a file:// mirror of the release. The
            #    live listing read would be UNAUTHENTICATED on v2.8.2 —
            #    a coin flip against the CI NAT pool's shared 60/h
            #    anonymous bucket (proven drained mid-job live), plus a
            #    read-after-write race with the asset index.
            env TEBAKO_HOME="$PUB_HOME" "$TEBAKO_CLI" publish --sign="$SIGNING_KEYID" --name "$app" \
              --release "tfs:github:tebako-packages/hello-runtimes:${{ github.ref_name }}" \
              $args \
              --registry-out "$PWD/tpkg-registry.yaml" \
              --upload-mirror "$mirror"
            # 2. SHIP: authenticated API calls only (ensure-release +
            #    uploads). The mirror leg already proved the install —
            #    the uploaded bytes are the same files.
            env TEBAKO_HOME="$PUB_HOME" "$TEBAKO_CLI" publish --sign="$SIGNING_KEYID" --name "$app" \
              --release "tfs:github:tebako-packages/hello-runtimes:${{ github.ref_name }}" \
              $args \
              --registry-out "$PWD/tpkg-registry.yaml" \
              --skip-verify
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out/installers

      - name: Sign + ship the installer containers
        # Containers ship signed-only: the legs build + rehearse on every
        # trigger but ship exactly when their signing plane armed (the
        # same vars the legs gated on — a disarmed plane means the
        # artifacts hold UNSIGNED rehearsal bytes, which never land on
        # the release). The tebako-plane signature (detached .asc per
        # container) rides the same CI subkey as the payloads.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIP_MSI: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          SHIP_PKG: ${{ vars.APPLE_INSTALLER_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          if [ "${SHIP_MSI:-}" = "true" ]; then
            for f in out/installers/installer-*-windows-ucrt64/*.msi; do assets+=("$f"); done
          fi
          if [ "${SHIP_PKG:-}" = "true" ]; then
            for f in out/installers/installer-*-macos-*/*.pkg; do assets+=("$f"); done
          fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::notice::both installer signing planes disarmed — no installer containers ship"
            exit 0
          fi
          TEBAKO_HOME="${TEBAKO_HOME:-$HOME/.tebako}"
          ./.tools/tebako-pkg sign --key="$SIGNING_KEYID" --no-sums "${assets[@]}"
          upload=()
          for f in "${assets[@]}"; do
            [ -f "$f.asc" ] || { echo "::error::$f.asc missing — the container signing did not land"; exit 1; }
            upload+=("$f" "$f.asc")
          done
          gh release upload "${{ github.ref_name }}" "${upload[@]}" --clobber
          echo "shipped ${#assets[@]} installer container(s) + .asc to ${GITHUB_REF_NAME}"

      - name: Registry default tracks the suite line
        # The suite versions together (Tebakofile): a publish moves every
        # payload's registry `default:` to the tag's version. `tebako
        # publish` deliberately never moves an existing default (a default
        # moves by explicit act only) — this tool call is the suite's.
        run: ruby tools/registry_default tpkg-registry.yaml "${{ github.ref_name }}"

      - name: Registry PR (main is protected)
        env:
          # The CI PAT authors the PR: a GITHUB_TOKEN-authored PR's checks
          # sit on the approval queue until they expire red.
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci" && git config user.email "tebako@ribose.com"
          if git diff --quiet tpkg-registry.yaml; then
            echo "registry unchanged (or the entries already landed on main)"; exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entries (the suite)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entries" \
              --body "Automated registry entries for ${{ github.ref_name }} (the build-payloads publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
